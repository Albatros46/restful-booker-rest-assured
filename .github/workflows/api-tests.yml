name: API Tests

# On every push / PR, and every night: the public API can change without a commit here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rest-assured:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run API tests
        env:
          RB_PASSWORD: ${{ secrets.RB_PASSWORD }}  # empty -> public demo password
        run: mvn -B test -DmaxResponseMs=5000
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/allure-results
            target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14
